[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-operations-audit-agent"
version = "0.1.0"
description = "Multi-agent finance and operations audit prototype built with the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-agents==0.22.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
audit-agent = "audit_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
