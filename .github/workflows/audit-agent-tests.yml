name: Audit Agent Tests

on:
  pull_request:
    paths:
      - "openai-audit-agent/**"
      - ".github/workflows/audit-agent-tests.yml"
  push:
    branches:
      - "feature/finance-operations-audit-agent"
    paths:
      - "openai-audit-agent/**"
      - ".github/workflows/audit-agent-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openai-audit-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run deterministic audit tests
        run: pytest -q
